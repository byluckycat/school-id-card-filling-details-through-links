<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff | School ID System</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><header><a class="brand" href="/"><span>✦</span> GREENFIELD <b>ACADEMY</b></a><div class="help">Staff portal</div></header><main><p class="eyebrow">STAFF ONLY</p><h1 style="font:700 48px 'Playfair Display',serif;margin:0 0 28px">Student records</h1><section class="panel"><div class="form-grid"><label>Staff access key<input id="key" type="password" placeholder="Enter staff key"></label><label>Search students<input id="query" placeholder="Name, admission no., or phone"></label></div><div class="actions"><button id="search" class="primary">Search records</button></div><div id="result" style="margin-top:25px;overflow:auto"></div></section></main><script>
const out=document.querySelector('#result');document.querySelector('#search').onclick=async()=>{out.textContent='Searching…';const r=await fetch('/api/admin/students?q='+encodeURIComponent(query.value),{headers:{'x-admin-key':key.value}}),j=await r.json();if(!r.ok){out.textContent=j.error;return}out.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th align="left">Student</th><th align="left">Admission no.</th><th align="left">Class</th><th align="left">Parent</th><th align="left">Status</th></tr>'+j.students.map(s=>`<tr style="border-top:1px solid #dce2dc"><td style="padding:12px 0">${s.student_name}</td><td>${s.admission_number}</td><td>${s.class_division}</td><td>${s.parent_name}<br><small>${s.phone_number}</small></td><td>${s.status}</td></tr>`).join('')};
</script></body></html>
